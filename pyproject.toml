[build-system]
requires = ["hatchling>=1.11.0"]
build-backend = "hatchling.build"

[project]
name = "cloudzero-uca-tools"
dynamic = ["version"]
description = "CloudZero UCA Toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "CloudZero", email = "support@cloudzero.com" },
]
keywords = [
    "CloudZero",
    "Toolkit",
    "UCA",
    "analysis",
    "cost",
    "economics",
    "unit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "beautifulsoup4>=4.11.2",
    "boto3==1.26.118",  # Pinned for AWS compatibility
    "click>=8.1.3",
    "colored>=1.4.4",
    "jq>=1.4.0",
    "progressbar>=2.5",
    "httpx>=0.27.0",
    "simplejson>=3.18.3",
    "stringcase>=1.2.0",
    "tabulate>=0.9.0",
    "rich==14.0.0",  # Updated from 13.3.5
    "user-agents==2.2.0",
    "geoip2==5.1.0",  # Updated from 4.6.0
    "python-whois==0.9.5",  # Updated from 0.8.0
    "termcolor>=2.4.0",
    "polars>=1.0.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "humanize>=4.0.0",
    "omegaconf>=2.3.0",
    "psycopg[binary]>=3.1.0",
    "pathlib>=1.0.1",
    "urllib3<2.0",  # Added constraint for boto3 compatibility
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "coverage>=7.5.1",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-env>=1.1.3",
    "hatch>=1.10.0",
    "ruff>=0.4.3",
    "pip-audit>=2.7.0",
    "twine>=5.0.0",
    "check-wheel-contents>=0.6.0",
]

[project.scripts]
uca = "uca.main:cli"

[project.urls]
Homepage = "https://github.com/Cloudzero/cloudzero-uca-tools"

[tool.hatch.version]
path = "uca/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["uca"]
[tool.hatch.build.targets.sdist]
include = [
    "/uca",
    "/uca/data/*",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "/.github",
]

[tool.pytest.ini_options]
doctest_optionflags = [
    "ELLIPSIS",
    "IGNORE_EXCEPTION_DETAIL"
]
env = [
    "NAMESPACE = TEST",
    "AWS_ACCESS_KEY_ID = testing",
    "AWS_SECRET_ACCESS_KEY = testing",
    "AWS_SESSION_TOKEN = testing",
    "AWS_DEFAULT_REGION = us-east-1"
]
markers = [
    "slow",
    "unit",
    "performance",
    "sns"
]
addopts = "--cov=uca --doctest-modules --cov-report term --showlocals -vvv"

[tool.hatch.envs.test]
dependencies = [
    "coverage>=7.5.1",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-env>=1.1.3"
]
[tool.hatch.envs.test.scripts]
all = "pytest"
all-no-cov = "all --no-cov"


[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4
exclude = [
    "build"
]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
    "C",    # convention
    "B",    # bugbear
    "D",    # pydocstyle
    "PYI",  # flake8-pyi
    "UP",   # pyupgrade
    "RUF",  # ruff
    "PIE",  # flake8-pie
    "PGH004", # pygrep-hooks - Use specific rule codes when using noqa
    "PLE",  # pylint error
    "PLW",  # pylint warning
    "PLR1714", # Consider merging multiple comparisons
    "T100", # flake8-debugger
]
ignore = [
    "E402",  # Module level import not at top of file
    "E501",  # Line too long (handled by formatter)
    "B005",  # Using .strip() with multi-character strings
    "B904",  # Within an except clause, raise exceptions
    "C901",  # Function is too complex
    "C408",  # Unnecessary dict/list/tuple call
    "D200",  # One-line docstring should fit on one line
    "D203",  # 1 blank line required before class docstring (conflicts with formatter)
    "D211",  # No blank lines allowed before class docstring
    "D212",  # Multi-line docstring summary should start at the first line
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D400",  # First line should end with a period
    "D415",  # First line should end with a period, question mark, or exclamation point
    "D417",  # Missing argument descriptions in the docstring
]


[tool.ruff.lint.per-file-ignores]
# Tests can use assertions and relative imports
"tests/**/*" = [
    "S101",
    "TID252"
]
"*/vendored/*" = [
    "D",
    "I",
    "UP",
    "B"
]

[tool.hatch.envs.lint]
detached = true
dependencies = [
    "ruff>=0.4.3"
]
[tool.hatch.envs.lint.scripts]
fix = "ruff check --fix"
check = "ruff check"

[tool.hatch.envs.pypi]
detached = true
dependencies = [
    "twine>=3.4.2",
    "wheel>=0.37.0"
]
[tool.hatch.envs.pypi.scripts]
upload = "twine upload dist/*"