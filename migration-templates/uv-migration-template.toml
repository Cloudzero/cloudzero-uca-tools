# UV Migration Template for CloudZero UCA Tools
# This template shows the recommended pyproject.toml structure for UV

[build-system]
# UV uses itself as the build backend
requires = ["hatchling"]  # Keep hatchling for now, UV can work with it
build-backend = "hatchling.build"

[project]
name = "cloudzero-uca-tools"
dynamic = ["version"]
description = "CloudZero UCA Toolkit"
readme = "README.md"
requires-python = ">=3.12"  # Updated to Python 3.12 as per requirements
license = { text = "Apache-2.0" }
authors = [
    { name = "CloudZero", email = "support@cloudzero.com" },
]
keywords = [
    "CloudZero",
    "Toolkit", 
    "UCA",
    "analysis",
    "cost",
    "economics",
    "unit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3.12",
]

# Production dependencies - moved from dependencies list
dependencies = [
    "beautifulsoup4>=4.11.2",
    "boto3==1.26.118",
    "click>=8.1.3",
    "colored>=1.4.4",
    "jq>=1.4.0",
    "progressbar>=2.5",
    "httpx>=0.25.0",  # Replace requests with httpx
    "simplejson>=3.18.3",
    "stringcase>=1.2.0",
    "tabulate>=0.9.0",
    "rich==13.3.5",
    "user-agents==2.2.0",
    "geoip2==4.6.0",
    "python-whois==0.8.0",
    "termcolor>=2.4.0",
    "pydantic>=2.0.0",  # Add pydantic for data validation
    "humanize>=4.0.0",  # Add humanize for human-readable output
]

[project.scripts]
uca = "uca.main:cli"

[project.urls]
Homepage = "https://github.com/Cloudzero/cloudzero-uca-tools"

# UV-specific configuration
[tool.uv]
# Development dependencies (replaces tool.rye.dev-dependencies)
dev-dependencies = [
    "pytest>=8.2.0",
    "coverage>=7.5.1", 
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-env>=1.1.3",
    "ruff>=0.4.3",
]

# UV workspace configuration (if using workspaces)
# workspace = { members = ["packages/*"] }

# UV package indexes (if using private registries)
# [[tool.uv.index]]
# name = "private"
# url = "https://private-registry.example.com/simple"

# Python version management
[tool.uv.python]
# Specify Python version for UV to manage
version = "3.12"

# Hatch version configuration (keep for compatibility)
[tool.hatch.version]
path = "uca/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["uca"]

[tool.hatch.build.targets.sdist]
include = [
    "/uca",
    "/uca/data/*",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "/.github",
]

# Testing configuration
[tool.pytest.ini_options]
doctest_optionflags = [
    "ELLIPSIS",
    "IGNORE_EXCEPTION_DETAIL"
]
env = [
    "NAMESPACE = TEST",
    "AWS_ACCESS_KEY_ID = testing",
    "AWS_SECRET_ACCESS_KEY = testing", 
    "AWS_SESSION_TOKEN = testing",
    "AWS_DEFAULT_REGION = us-east-1"
]
markers = [
    "slow",
    "unit",
    "performance",
    "sns"
]
addopts = "--cov=uca --doctest-modules --cov-report term --showlocals -vvv"

# Ruff configuration (enhanced)
[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4
exclude = [
    "build",
    ".venv",
    "venv",
    "__pycache__",
    ".git",
    ".ruff_cache",
    ".mypy_cache",
    ".pytest_cache",
    "dist",
    "node_modules",
]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint]
select = [
    # Core rules
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings  
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    
    # Additional rules per CLAUDE.md
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "PIE",    # flake8-pie
    "PGH004", # pygrep-hooks - Use specific rule codes when using noqa
    "PLE",    # pylint error
    "PLW",    # pylint warning
    "PLR1714",# pylint - Consider merging multiple comparisons
    "T100",   # flake8-debugger
    
    # Additional quality rules
    "D",      # pydocstyle
    "PYI",    # flake8-pyi
    "RUF",    # ruff specific rules
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "G",      # flake8-logging-format
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
]

ignore = [
    # Per CLAUDE.md requirements
    "E402",   # Module level import not at top of file
    "E501",   # Line too long (handled by formatter)
    "B005",   # Using .strip() with multi-character strings
    "B904",   # Within an except clause, raise ... from err
    "C901",   # Function is too complex
    "C408",   # Unnecessary dict call
    
    # Additional ignores from current config
    "D200",   # One-line docstring should fit on one line
    "D211",   # No blank lines allowed before class docstring
    "D212",   # Multi-line docstring summary should start at the first line
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D400",   # First line should end with a period
    "D415",   # First line should end with a period, question mark, or exclamation point
    "D417",   # Missing argument descriptions in the docstring
]

[tool.ruff.lint.per-file-ignores]
# Tests can use assertions and relative imports
"tests/**/*" = [
    "S101",    # Use of assert detected
    "TID252",  # Relative imports
    "D",       # Missing docstrings
]

# Vendored code has different standards
"*/vendored/*" = [
    "D",       # Docstrings
    "I",       # Import sorting
    "UP",      # Pyupgrade
    "B",       # Bugbear
]

# Init files
"__init__.py" = [
    "F401",    # Imported but unused
    "F403",    # Star imports
]

[tool.ruff.lint.isort]
known-first-party = ["uca"]
force-single-line = false
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"  # or "numpy", "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

# UV scripts (similar to hatch environments)
[tool.uv.scripts]
# Development scripts
test = "pytest"
test-no-cov = "pytest --no-cov"
lint = "ruff check ."
format = "ruff format ."
lint-fix = "ruff check --fix ."

# Build scripts  
build = "python -m build"
clean = "rm -rf build dist *.egg-info"

# Release scripts
upload = "twine upload dist/*"
release = ["clean", "build", "upload"]